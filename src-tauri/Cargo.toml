[package]
name = "yapr"
description = "YetAnotherPDFReader - a fast, lightweight, Acrobat-style PDF reader"
authors = ["YetAnotherPDFReader contributors"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "yapr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yapr-pdf = { path = "../crates/yapr-pdf" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
chrono.workspace = true
parking_lot = "0.12"
arboard = { version = "3", default-features = false, features = ["image-data"] }
# OCR: PaddleOCR models through ONNX Runtime.
oar-ocr = { version = "0.10", default-features = false, features = ["simd"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

# ONNX Runtime is linked statically where the prebuilt libraries fit the platform, and loaded
# at run time from Microsoft's official shared library, shipped inside the packages, elsewhere:
# on Linux (the prebuilt static library needs glibc 2.38+; the shared one runs on 2.28+) and on
# Intel Macs (there is no prebuilt static library for them).
[target.'cfg(not(any(target_os = "linux", all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["download-binaries", "tls-native", "std", "ndarray", "tracing"] }

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std", "ndarray", "tracing"] }
