# Builds the macOS disk images (Apple Silicon and Intel) for a release and uploads them to it.
#
#   gh workflow run macos.yml -f tag=v0.4.1
#
# The apps are signed ad hoc (no Apple Developer ID), so they are not notarized: on first start
# macOS asks to confirm in System Settings ▸ Privacy & Security, or run
#   xattr -dr com.apple.quarantine /Applications/YetAnotherPDFReader.app
name: macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v0.4.1)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      # The prebuilt ONNX Runtime (OCR) needs macOS 13.4 or later.
      MACOSX_DEPLOYMENT_TARGET: "13.4"
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-${{ matrix.target }}-

      - run: npm ci --no-audit --no-fund

      - name: Build
        run: >
          npx tauri build --target ${{ matrix.target }} --bundles app,dmg
          --config '{"bundle":{"macOS":{"minimumSystemVersion":"13.4"}}}'

      - name: Check the bundle
        run: |
          app="$(find target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          lipo -archs "$exe"
          otool -L "$exe"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleShortVersionString|LSMinimumSystemVersion|CFBundleDocumentTypes' || true
          ls -la target/${{ matrix.target }}/release/bundle/dmg

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" target/${{ matrix.target }}/release/bundle/dmg/*.dmg --clobber
