# Builds and publishes a release when a version tag is pushed:
#
#   git tag v0.4.2 && git push origin v0.4.2
#
# Runs the unit tests, builds Windows (installer, MSI, portable zip), macOS (Apple silicon and
# Intel DMGs) and Linux (deb, rpm, AppImage) in parallel, then creates the GitHub release with
# notes from CHANGELOG.md (scripts/release-notes.mjs) and SHA-256 checksums. Nothing is published
# unless the tests and every build succeed.
#
# Manual runs (Actions ▸ Release ▸ Run workflow) rebuild an existing tag: pick the platforms, and
# untick "publish" to only build (the files are kept as workflow artifacts for a week).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.4.2)
        required: true
      platforms:
        description: Platforms to build
        type: choice
        options: [all, windows, macos, linux]
        default: all
      publish:
        description: Upload to the GitHub release
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PLATFORMS: ${{ inputs.platforms || 'all' }}
  # Linux system packages for building (also listed in scripts/build-linux.sh).
  LINUX_DEPS: >-
    build-essential curl file libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
    libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf rpm libfuse2

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: The version matches the tag
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$version" = "$TAG" ] || { echo "package.json says $version, the tag is $TAG"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check
      - run: npm ci --no-audit --no-fund
      # Type check and front-end build (the Rust crate embeds dist/).
      - run: npm run build
      - run: npm test
      - name: ONNX Runtime for the OCR tests
        run: |
          curl -fsSL https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz | tar -xz -C "$RUNNER_TEMP"
          mkdir -p src-tauri/ocr/linux
          cp -L "$RUNNER_TEMP/onnxruntime-linux-x64-1.22.0/lib/libonnxruntime.so" src-tauri/ocr/linux/
          echo "ORT_DYLIB_PATH=$GITHUB_WORKSPACE/src-tauri/ocr/linux/libonnxruntime.so" >> "$GITHUB_ENV"
      - run: cargo test --workspace

  windows:
    name: Windows
    if: contains(fromJSON('["all", "windows"]'), inputs.platforms || 'all')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --no-audit --no-fund
      - run: npx tauri build --bundles nsis,msi
      - name: Collect the installers and make the portable zip
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist, portable/YetAnotherPDFReader | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi dist/
          Copy-Item target/release/yapr.exe portable/YetAnotherPDFReader/YetAnotherPDFReader.exe
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md portable/YetAnotherPDFReader/
          Copy-Item ci/packaging/portable portable/YetAnotherPDFReader/portable
          Compress-Archive -Path portable/YetAnotherPDFReader -DestinationPath "dist/YetAnotherPDFReader_${version}_x64_portable.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.target }})
    if: contains(fromJSON('["all", "macos"]'), inputs.platforms || 'all')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      # The prebuilt ONNX Runtime (OCR) needs macOS 13.4 or later.
      MACOSX_DEPLOYMENT_TARGET: "13.4"
      # Ad-hoc signature: required on Apple silicon; the app is not notarized.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci --no-audit --no-fund
      - run: >
          npx tauri build --target ${{ matrix.target }} --bundles app,dmg
          --config '{"bundle":{"macOS":{"minimumSystemVersion":"13.4"}}}'
      - name: Check the bundle
        run: |
          app="$(find target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          lipo -archs "$exe"
          otool -L "$exe"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir dist && cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist/ && ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux
    if: contains(fromJSON('["all", "linux"]'), inputs.platforms || 'all')
    # Ubuntu 22.04 (glibc 2.35) keeps the packages compatible with most current distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/linux-bundle/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [check, windows, macos, linux]
    # Every selected build must succeed (skipped platforms are fine).
    if: >-
      always() && needs.check.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: (cd dist && sha256sum * | tee ../checksums.txt)
      - name: Notes (preview)
        run: |
          node scripts/release-notes.mjs "$TAG" checksums.txt > notes.md
          { echo "## $(node scripts/release-notes.mjs "$TAG" checksums.txt --title)"; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to the release
        if: env.PUBLISH == 'true'
        run: |
          title="$(node scripts/release-notes.mjs "$TAG" checksums.txt --title)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$title" --notes-file notes.md
          fi
          # Notes and checksums cover every file of the release, including ones from earlier runs.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | [.name, (.digest // "")] | @tsv' |
            while IFS=$'\t' read -r name digest; do
              if [ -n "$digest" ]; then
                echo "${digest#sha256:}  $name"
              elif [ -f "dist/$name" ]; then
                (cd dist && sha256sum "$name")
              else
                gh release download "$TAG" -p "$name" -O - | sha256sum | sed "s|-\$|$name|"
              fi
            done > all-checksums.txt
          cat all-checksums.txt
          node scripts/release-notes.mjs "$TAG" all-checksums.txt > notes.md
          gh release edit "$TAG" --title "$title" --notes-file notes.md
